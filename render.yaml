services:
    - type: web
    name: safespace-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: GROQ_API_KEY
        sync: false # Render dashboard me manually dalna

    - type: web
    name: safespace-frontend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
            - key: BACKEND_URL
        value: https://safespace-backend.onrender.com/ask # yahan apne backend ka URL aayega